# 配置模板：把本文件复制为 config.ini（config.ini 已被 .gitignore 忽略，不会提交），
# 然后运行  gen_password.py （或双击“设置密码.bat”）写入查询密码的 SHA-256 哈希。
# 改完重启 app.py 或双击“启动查询.bat”生效。
#   端口：把 port 改成想要的数字，或临时用  启动查询.bat 8080
#   host：0.0.0.0 = 本机同事都能访问；127.0.0.1 = 只允许本机
#   session_hours：登录后免输密码的小时数，0 = 关闭浏览器就要重新登录
#   密码：别手填，运行  gen_password.py  ，这里只保存 SHA-256 哈希

[server]
host = 0.0.0.0
port = 8000
session_hours = 8
db = devices.db

[security]
# true = 不要求密码，仅本机调试用
allow_no_password = false
query_password_sha256 =
